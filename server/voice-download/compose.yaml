services:
  voice-tunnel:
    image: tailscale/tailscale:stable
    container_name: japanese-voice-tunnel
    hostname: japanese-voice-download
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: japanese-voice-download
    volumes:
      - tailscale-state:/var/lib/tailscale
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
      - /var/run/tailscale:mode=0700,size=4m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 0.25
    cpu_shares: 128
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    networks:
      - tunnel-egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  voice-download:
    image: caddy:2.10-alpine
    container_name: japanese-voice-download
    restart: unless-stopped
    user: "1000:1000"
    network_mode: service:voice-tunnel
    depends_on:
      - voice-tunnel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./voices:/srv/voices:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700,size=16m,noexec,nosuid,nodev
      - /data:uid=1000,gid=1000,mode=0700,size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 0.50
    cpu_shares: 256
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/voices/index.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel-egress: {}

volumes:
  tailscale-state: {}
